name: Controlli

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla dati, link e versione della cache offline
        run: node tools/controlla.mjs
